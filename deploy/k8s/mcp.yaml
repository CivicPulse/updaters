# Configure the image and Secret before applying. No traffic switches automatically.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civpulse-mcp
  labels:
    app.kubernetes.io/name: civpulse-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: civpulse-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civpulse-mcp
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: civpulse-mcp:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8789
          envFrom:
            - secretRef:
                name: civpulse-mcp
          env:
            - name: RUST_LOG
              value: info
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: civpulse-mcp
spec:
  selector:
    app.kubernetes.io/name: civpulse-mcp
  ports:
    - name: http
      port: 8789
      targetPort: http
