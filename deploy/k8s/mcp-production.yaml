# DigitalOcean production; the existing tunnel and Traefik own the public host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civpulse-mcp
  namespace: civpulse-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: civpulse-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civpulse-mcp
    spec:
      imagePullSecrets:
        - name: registry-hatchk8s
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: civpulse-mcp
              topologyKey: kubernetes.io/hostname
      containers:
        - name: mcp
          # A distinct MCP tag shares the API repository because the registry permits five repositories.
          image: registry.digitalocean.com/hatchk8s/civpulse-webapi@sha256:5f2225ccb1cbe28a159bd82cd6211523d0e4df104467fdccc5bed04385201686
          ports:
            - name: http
              containerPort: 8789
          env:
            - name: RUST_LOG
              value: info
            - name: MCP_LISTEN
              value: 0.0.0.0:8789
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: webapi-supabase
                  key: url
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: webapi-supabase
                  key: publishable-key
            - name: MCP_RESOURCE_URL
              value: https://webapi.civpulse.org/mcp/v2
            - name: AUTHORIZATION_SERVER
              value: https://drzcrodqflzkzzbqsags.supabase.co/auth/v1
            - name: KB_API_URL
              value: https://kb-api.civpulse.org
            - name: GEORGIA_SOURCE_READER_URL
              value: https://civpulse-georgia-source.kerryhatcher.workers.dev/
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: civpulse-mcp
  namespace: civpulse-prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: civpulse-mcp
  ports:
    - name: http
      port: 8789
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-ingress
  namespace: civpulse-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: civpulse-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: civpulse-edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8789
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: civpulse-mcp
  namespace: civpulse-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: civpulse-mcp
