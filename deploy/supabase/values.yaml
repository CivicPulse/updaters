  db:
    # Upstream skips the whole config copy when a fresh block volume contains
    # lost+found. Fill only missing defaults; never replace existing config/keys.
    extraInitContainers:
    - name: complete-pgsodium-config
      image: supabase/postgres:17.11.0.003@sha256:7374d196da7e301512cc5329e18040e0f7bb856287b323777cdadecccbc6c7e4
      command: [/bin/sh, -ec]
      args:
      - |
        # BusyBox cp -n skips an existing directory as a whole. Walk entries
        # explicitly, filling absent paths without replacing persisted keys.
        copy_missing() (
          source=$1
          target=$2
          if [ -d "$source" ] && [ ! -L "$source" ] && [ -d "$target" ] && [ ! -L "$target" ]; then
            for entry in "$source"/* "$source"/.[!.]* "$source"/..?*; do
              if [ -e "$entry" ] || [ -L "$entry" ]; then
                copy_missing "$entry" "$target/${entry##*/}"
              fi
            done
          elif [ ! -e "$target" ] && [ ! -L "$target" ]; then
            cp -a "$source" "$target"
          fi
        )
        # CSI volume roots start root-owned. Postgres must create its root key;
        # change only the mount directory owner, preserving every persisted file.
        chown postgres:postgres /mnt/pgsodium
        copy_missing /etc/postgresql-custom /mnt/pgsodium
        test -d /mnt/pgsodium/conf.d
        test -f /mnt/pgsodium/wal-g.conf
        test -f /mnt/pgsodium/read-replica.conf
        test -f /mnt/pgsodium/supautils.conf
      volumeMounts:
      - mountPath: /mnt/pgsodium
        name: pgsodium
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
          add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    enabled: true
