apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-tunnel-only
  namespace: civpulse-edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8000
